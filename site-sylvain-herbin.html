<style>
:root{
  --noir:#08090C;
  --bg:#08090C;
  --dentine:#C9A46B;
  --or:#E7CA97;
  --bleu:#A9CEDE;
  --email:#CFE0E7;
  --ivoire:#F6F3ED;
  --gris:#BCC2CB;
  --soft:#D2D7DE;
  --card:rgba(237,232,222,.05);
  --hair:rgba(237,232,222,.14);
  --display:"Bodoni Moda",Georgia,serif;
  --body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --pad:clamp(20px,5vw,80px);
}
*{box-sizing:border-box}
:root{color-scheme:dark}
html{scroll-behavior:smooth;background:#08090C !important}
body{
  margin:0;background:#08090C !important;color:var(--ivoire);
  font-family:var(--body);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;position:relative;min-height:100%;
}
/* couche de fond réelle : ne peut pas être écrasée par une visionneuse */
.bg{position:fixed;inset:0;background:#08090C;z-index:-2;pointer-events:none}
main,footer,.topbar,.strat{position:relative;z-index:1}
@media(prefers-color-scheme:light){
  html,body{background:#08090C !important;color:var(--ivoire)}
}
img{max-width:100%;display:block}
a{color:inherit}

/* ---------- thème papier (sections claires) ---------- */
.theme-light{
  --bg:#F4F1EA;
  --dentine:#9A7534;
  --or:#8A6224;
  --bleu:#2F6C85;
  --email:#4E7C8F;
  --ivoire:#15171B;
  --gris:#565C64;
  --soft:#4A5058;
  --card:rgba(21,23,27,.05);
  --hair:rgba(21,23,27,.16);
  background:#F4F1EA;
  color:#15171B;
}
.theme-light .contact__btn,.theme-light .hero__cta{color:#FBF8F1}

/* ---------- utilitaires ---------- */
.eyebrow{
  font-family:var(--body);font-size:13px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--bleu);
  margin:0 0 18px;
}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.rule{
  height:1px;border:0;margin:0;
  background:linear-gradient(90deg,var(--dentine),rgba(191,214,222,.55) 55%,transparent);
}

/* ---------- indicateur de stratification (signature) ---------- */
.strat{
  position:fixed;right:26px;top:50%;transform:translateY(-50%);
  height:34vh;width:34px;z-index:40;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center;
}
.strat__track{position:relative;width:2px;height:100%;background:rgba(130,134,142,.3)}
.strat__fill{
  position:absolute;left:0;bottom:0;width:2px;height:0%;
  background:linear-gradient(to top,var(--dentine) 0%,#DCC79A 38%,var(--email) 78%,rgba(191,214,222,.25) 100%);
  transition:height .12s linear;
}
.strat__label{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(90deg);transform-origin:center;
  white-space:nowrap;font-size:9px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gris);opacity:.55;margin-left:26px;
}
@media(max-width:900px){.strat{display:none}}

/* ---------- barre de langue ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px var(--pad);background:none;pointer-events:none;
}
.topbar__name{
  font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.04em;
  color:#F6F3ED;background:rgba(8,9,12,.78);padding:7px 14px;border-radius:2px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .4s ease;
}
.topbar.is-scrolled .topbar__name{opacity:1}
.lang{
  display:flex;gap:2px;align-items:center;pointer-events:auto;
  background:rgba(8,9,12,.78);padding:3px 8px;border-radius:2px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.lang button{
  background:none;border:0;padding:4px 7px;cursor:pointer;color:#AEB4BD;
  font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
}
.lang button.is-on{color:#F6F3ED}
.lang span{color:var(--gris);opacity:.4}
.lang button:focus-visible,a:focus-visible,button:focus-visible{
  outline:1px solid var(--dentine);outline-offset:3px;
}

/* ---------- hero ---------- */
.hero{padding:132px 0 clamp(70px,10vh,130px);position:relative;overflow:hidden;background:var(--bg)}
.hero::before{
  content:"";position:absolute;inset:-24% 10% auto;height:80vh;
  background:
    radial-gradient(ellipse 55% 48% at 50% 44%,rgba(201,164,107,.11),transparent 70%),
    radial-gradient(ellipse 92% 62% at 50% 42%,rgba(237,232,222,.06),transparent 74%);
  pointer-events:none;filter:blur(8px);
}
.hero__img{
  position:relative;max-width:1040px;margin:0 auto;
  -webkit-mask-image:radial-gradient(ellipse 82% 78% at 50% 50%,#000 52%,transparent 100%);
  mask-image:radial-gradient(ellipse 82% 78% at 50% 50%,#000 52%,transparent 100%);
}
.hero__img img{width:100%}
.hero__txt{position:relative;text-align:center;margin-top:clamp(28px,5vw,56px)}
.hero__name{
  font-family:var(--display);font-weight:600;color:#F2DFBB;
  font-size:clamp(48px,9.5vw,112px);line-height:.98;letter-spacing:0;
  margin:0;
}
.hero__role{
  font-family:var(--display);font-style:italic;font-weight:500;
  font-size:clamp(19px,2.5vw,28px);color:var(--or);margin:16px 0 0;
}
.hero__rule{
  width:min(420px,60%);height:1px;margin:34px auto 30px;border:0;
  background:linear-gradient(90deg,transparent,var(--dentine) 25%,var(--email) 75%,transparent);
}
.hero__claim{
  max-width:620px;margin:0 auto;color:var(--gris);
  font-size:clamp(15px,1.7vw,18px);
}
.hero__meta{
  margin-top:24px;font-size:12.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soft);
}
.hero__cta{
  display:inline-block;margin-top:36px;padding:18px 40px;
  border:1px solid var(--dentine);background:var(--dentine);color:#0B0B0D;
  text-decoration:none;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  transition:background .3s ease,transform .3s ease;
}
.hero__cta:hover{background:var(--or);border-color:var(--or);transform:translateY(-2px)}

/* ---------- sections ---------- */
.sec{padding:clamp(72px,11vh,140px) 0;background:var(--bg)}

.sec__head{max-width:760px}
.h2{
  font-family:var(--display);font-weight:600;color:var(--ivoire);
  font-size:clamp(31px,4.6vw,54px);line-height:1.12;margin:0 0 24px;letter-spacing:0;
}
.lede{color:var(--soft);font-size:clamp(16.5px,1.8vw,19px);line-height:1.7;max-width:62ch;margin:0}
.lede + .lede{margin-top:18px}

/* ---------- formation ---------- */
.creds{margin-top:clamp(46px,6vw,72px)}
.cred-list{list-style:none;margin:20px 0 0;padding:0}
.cred-list li{
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;
  padding:20px 0;border-bottom:1px solid var(--hair);
}
.cred-list li:first-child{border-top:1px solid var(--hair)}
.cred__t{
  font-family:var(--display);font-weight:600;color:var(--ivoire);
  font-size:clamp(17px,2vw,21px);line-height:1.3;
}
.cred__d{
  font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--or);
}

/* ---------- réalisations ---------- */
.works{margin-top:clamp(48px,7vw,90px);display:flex;flex-direction:column;gap:clamp(72px,10vw,150px)}
.work{display:grid;grid-template-columns:repeat(12,1fr);gap:28px;align-items:end}
.work__fig{grid-column:1/9;margin:0;position:relative}
.work__fig img{width:100%;filter:saturate(.96)}
.work__cap{grid-column:9/13}
.work--alt .work__fig{grid-column:5/13;order:2}
.work--alt .work__cap{grid-column:1/5;order:1}
.work__tag{
  font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--bleu);margin:0 0 14px;
}
.work__title{
  font-family:var(--display);font-weight:600;color:var(--ivoire);
  font-size:clamp(22px,2.3vw,29px);line-height:1.22;margin:0 0 14px;
}
.work__desc{color:var(--gris);font-size:15.5px;line-height:1.7;margin:0}
.work__line{width:44px;height:1px;background:var(--dentine);margin:0 0 18px;opacity:.8}
@media(max-width:860px){
  .work,.work--alt{display:block}
  .work__cap{margin-top:22px}
  .work--alt .work__fig,.work--alt .work__cap{order:initial}
}

/* ---------- cas clinique ---------- */
.case{
  margin:clamp(40px,6vw,64px) 0 clamp(58px,8vw,96px);
  padding-bottom:clamp(58px,8vw,96px);border-bottom:1px solid var(--hair);
}
.case__pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.case__fig{margin:0;position:relative}
.case__fig img{width:100%}
.case__lbl{
  position:absolute;left:0;bottom:0;padding:9px 16px;
  background:rgba(8,9,12,.85);color:#F6F3ED;
  font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
}
.case__lbl--after{background:var(--dentine);color:#0B0B0D}
.case__txt{max-width:62ch;margin-top:28px}
@media(max-width:640px){.case__pair{grid-template-columns:1fr}}

/* ---------- engagements ---------- */
.pledge{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:2px}
.pledge__item{background:var(--card);padding:32px 30px 36px}
.pledge__k{
  display:block;font-family:var(--display);font-weight:600;font-size:20px;
  color:var(--ivoire);margin-bottom:12px;
}
.pledge__v{color:var(--gris);font-size:15.5px;line-height:1.7}
@media(max-width:860px){.pledge{grid-template-columns:1fr}}

/* ---------- services ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:56px}
.card{background:var(--card);padding:34px 30px 38px}
.card h3{
  font-family:var(--display);font-weight:600;color:var(--ivoire);font-size:21px;line-height:1.28;margin:16px 0 12px;
}
.card p{color:var(--gris);font-size:15.5px;line-height:1.7;margin:0}
.card__num{font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--or)}
@media(max-width:860px){.grid3{grid-template-columns:1fr}}

.specs{display:flex;flex-wrap:wrap;gap:0;margin-top:56px;border-top:1px solid var(--hair)}
.spec{
  flex:1 1 240px;padding:26px 24px 26px 0;border-bottom:1px solid var(--hair);
}
.spec__k{font-family:var(--display);font-size:clamp(25px,3.4vw,35px);font-weight:600;color:var(--ivoire);display:block}
.spec__v{font-size:12.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--soft)}

/* ---------- contact ---------- */
.contact{text-align:center;padding:clamp(90px,14vh,170px) 0}
.contact__mail{
  display:inline-block;font-family:var(--display);font-weight:500;
  font-size:clamp(21px,3.4vw,36px);color:var(--ivoire);text-decoration:none;
  border-bottom:1px solid rgba(201,164,107,.55);padding-bottom:6px;
  transition:border-color .3s ease,color .3s ease;letter-spacing:-.005em;
}
.contact__mail:hover{color:var(--dentine);border-color:var(--dentine)}
.contact__btn{
  display:inline-block;margin-bottom:36px;padding:18px 40px;
  background:var(--dentine);color:#0B0B0D;text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  transition:background .3s ease,transform .3s ease;
}
.contact__btn:hover{background:var(--or);transform:translateY(-2px)}
.contact__meta{margin-top:34px;color:var(--soft);font-size:15px;line-height:2}
.foot{
  border-top:1px solid var(--hair);padding:26px 0 40px;background:#08090C;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  font-size:12.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);
}


/* ---------- pièce hors laboratoire ---------- */
.aside{
  margin-top:clamp(72px,10vw,140px);padding-top:clamp(48px,7vw,80px);
  border-top:1px solid var(--hair);
  display:grid;grid-template-columns:repeat(12,1fr);gap:28px;align-items:center;
}
.aside__fig{grid-column:1/8;margin:0}
.aside__fig img{width:100%}
.aside__txt{grid-column:8/13}
@media(max-width:860px){
  .aside{display:block}
  .aside__txt{margin-top:22px}
}

/* ---------- révélation ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.2,.6,.2,1),transform .9s cubic-bezier(.2,.6,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .strat__fill{transition:none}
}
</style>
<noscript><style>.rv{opacity:1;transform:none}</style></noscript>
</head>

let lang = "fr";

function renderWorks(){
  const host = document.getElementById("works");
  host.innerHTML = "";
  WORKS[lang].forEach((w,idx)=>{
    const a = document.createElement("article");
    a.className = "work rv" + (idx%2 ? " work--alt" : "");
    a.innerHTML =
      '<figure class="work__fig"><img loading="lazy" src="'+IMG[w.i]+'" alt="'+w.t.replace(/"/g,"&quot;")+'"></figure>'+
      '<div class="work__cap"><p class="work__tag">'+w.tag+'</p><div class="work__line"></div>'+
      '<h3 class="work__title">'+w.t+'</h3><p class="work__desc">'+w.d+'</p></div>';
    host.appendChild(a);
  });
  observe();
}

function apply(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.title = d.docTitle;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k = el.getAttribute("data-i");
    if(d[k] !== undefined) el.innerHTML = d[k];
  });
  document.querySelectorAll(".lang button").forEach(b=>{
    b.classList.toggle("is-on", b.dataset.lang === lang);
  });
  document.getElementById("imgAvant").alt =
    lang === "fr" ? "Situation initiale : dentition usée, ligne du sourire effondrée"
                  : "Initial situation: worn dentition, collapsed smile line";
  document.getElementById("imgApres").alt =
    lang === "fr" ? "Après traitement : ligne du sourire rétablie"
                  : "After treatment: smile line restored";
  document.getElementById("imgAvant2").alt =
    lang === "fr" ? "Avant : couronne provisoire décolorée sur l'incisive centrale"
                  : "Before: discoloured provisional crown on the central incisor";
  document.getElementById("imgApres2").alt =
    lang === "fr" ? "Après : céramique stratifiée sur zircone, intégrée aux dents naturelles"
                  : "After: layered ceramic on zirconia, integrated with the natural teeth";
  document.getElementById("imgMedusa").alt =
    lang === "fr" ? "Masque de Médusa en or jaune serti de deux rubis"
                  : "Medusa mask in yellow gold set with two rubies";
  document.getElementById("heroImg").alt =
    lang === "fr" ? "Arcade antérieure en céramique stratifiée avec fausse gencive"
                  : "Layered ceramic anterior arch with gingival work";
  renderWorks();
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click",()=>{ lang = b.dataset.lang; apply(); });
});

let io;
function observe(){
  if(!("IntersectionObserver" in window)){
    document.querySelectorAll(".rv").forEach(e=>e.classList.add("in")); return;
  }
  if(!io){
    io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    },{rootMargin:"0px 0px -8% 0px",threshold:.08});
  }
  document.querySelectorAll(".rv:not(.in)").forEach(e=>io.observe(e));
}

const fill = document.getElementById("stratFill");
const topbar = document.getElementById("topbar");
function onScroll(){
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
  fill.style.height = (p*100).toFixed(1) + "%";
  topbar.classList.toggle("is-scrolled", window.scrollY > 260);
}
window.addEventListener("scroll", onScroll, {passive:true});

apply();
onScroll();
